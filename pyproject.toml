[project]
name = "agent_harness"
version = "1.0.0"
description = "AgentHarness — evaluate LLM agents on public benchmarks"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.50",
    "anthropic>=0.34",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "e2b-code-interpreter>=2.6.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1.6",
    "tiktoken>=0.12.0",
    "pyyaml>=6.0",
    "tenacity>=9.1.4",
    "huggingface-hub>=0.20",
    "Pillow>=10.0",
    "harbor>=0.4.0",
    "wikipedia>=1.4.0",
    "datasets>=4.8.4",
    "pyarrow>=23.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
]
# Persistent evidence vault for the deep_research workflow (FTS5 source
# store + provenance + dedup), reusing the hyperresearch engine. Optional:
# workflows/deep_research/vault.py lazily imports it and degrades to a
# no-op (pipeline behaves as before) when it is not installed.
vault = [
    "hyperresearch>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_harness", "plugins", "workflows"]

[tool.ruff]
target-version = "py312"
line-length = 100
