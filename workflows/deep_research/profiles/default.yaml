# deep_research — default profile
#
# One OpenAI-compatible endpoint for all roles, with optional per-role
# model overrides (merged over `default`). Behavioral knobs (turn budgets,
# parallelism, iteration bounds) live in config.py depth presets, not here.

default:
  model: ${OPENAI_MODEL}
  api_key: ${OPENAI_API_KEY}
  base_url: ${OPENAI_BASE_URL}
  temperature: 0.7
  max_tokens: 8192

roles:
  # Long-form synthesis benefits from a bigger completion budget.
  dr_writer:
    max_tokens: 16384
    temperature: 0.6
  dr_verifier:
    max_tokens: 16384
    temperature: 0.2
  # Cheap-and-fast tier is fine for verification legwork; point
  # DR_FACT_CHECK_MODEL at a smaller model to cut cost (empty value
  # falls back to `default.model`).
  dr_fact_checker:
    model: ${DR_FACT_CHECK_MODEL}
    temperature: 0.2
  dr_conflict_checker:
    temperature: 0.2
  dr_reviewer:
    temperature: 0.3
  dr_planner:
    temperature: 0.5
